<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>利利奇 21 歲生日快樂 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a63;--pink:#ff5fa2;--sun:#ffd23f;--sky:#4fc3ff;--mint:#5eecbd;--lil:#b08cff;--org:#ff9a3c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:500;color:var(--ink);min-height:100vh;
background:radial-gradient(circle,#ffffff99 3px,transparent 3.5px) 0 0/34px 34px,linear-gradient(180deg,#bdeaff 0%,#ffe6f3 55%,#fff3c4 100%);background-attachment:fixed;overflow-x:hidden}
section{max-width:520px;margin:0 auto;padding:28px 18px 40px;text-align:center}
h1{font-weight:900;line-height:1.05;font-size:clamp(44px,15vw,76px);letter-spacing:2px}
h1 small{display:block;font-size:.5em;letter-spacing:6px;margin-top:4px}
h1 span{display:inline-block;cursor:pointer;-webkit-text-stroke:7px #fff;paint-order:stroke fill;text-shadow:0 5px 0 #0002;animation:drop .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-120px) rotate(-30deg);opacity:0}}
h1 span.b{animation:bnc .5s}
@keyframes bnc{40%{transform:translateY(-22px) scale(1.2) rotate(8deg)}}
.hint{margin:6px auto 0;font-size:18px;font-weight:900;background:#fff;border-radius:99px;display:inline-block;padding:8px 18px;box-shadow:0 4px 0 #0002}
svg.cake{width:min(100%,430px);display:block;margin:6px auto 0;overflow:visible}
.hit{cursor:pointer;fill:#fff;fill-opacity:.01;stroke:var(--org);stroke-width:3;stroke-dasharray:6 6;animation:pulse 1.2s infinite;transform-box:fill-box;transform-origin:center}
.hit.done{display:none}
@keyframes pulse{50%{transform:scale(1.2)}}
.fl{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s}
.fl.on{opacity:1;animation:flick .25s infinite alternate}
@keyframes flick{to{transform:scale(1.12,.92) rotate(4deg)}}
.smoke{position:absolute;font-size:30px;animation:up 1.6s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110px) scale(2);opacity:0}}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button.big{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:99px;padding:13px 22px;color:#fff;background:var(--pink);box-shadow:0 6px 0 #c23b7a;cursor:pointer}
button.big.alt{background:var(--sky);box-shadow:0 6px 0 #2a8ec4}
button.big:active{transform:translateY(5px);box-shadow:0 1px 0 #0003}
.wrap{position:relative;display:inline-block;width:100%}
#bals{display:flex;justify-content:center;gap:18px;margin-top:10px}
.bal{font-size:44px;width:92px;height:108px;border:0;border-radius:50% 50% 48% 48%;cursor:pointer;position:relative;box-shadow:inset -10px -10px 0 #0001,0 6px 0 #0001;animation:flo 2.4s ease-in-out infinite}
.bal:nth-child(2){animation-delay:-.8s}.bal:nth-child(3){animation-delay:-1.6s}
.bal:after{content:"";position:absolute;left:50%;bottom:-26px;width:2px;height:26px;background:#0004}
@keyframes flo{50%{transform:translateY(-14px) rotate(3deg)}}
#wishes{display:grid;gap:12px;margin-top:26px}
.wish{font-weight:900;font-size:clamp(20px,5.6vw,26px);padding:16px 14px;border-radius:26px;border:4px solid #fff;box-shadow:0 6px 0 #0002;animation:pop .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}}
h2{font-weight:900;font-size:clamp(28px,8vw,40px);line-height:1.2}
#seven{font-size:clamp(90px,34vw,150px);font-weight:900;color:var(--pink);line-height:1;-webkit-text-stroke:8px #fff;paint-order:stroke fill;text-shadow:0 8px 0 #0002;display:inline-block}
#stack{position:relative;width:min(290px,76vw);height:min(400px,104vw);margin:26px auto 8px}
.pol{position:absolute;inset:0;background:#fff;padding:10px 10px 46px;border-radius:8px;box-shadow:0 8px 18px #0003;cursor:pointer;transition:transform .38s,opacity .38s;transform:rotate(var(--r))}
.pol img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
.pol b{position:absolute;left:0;right:0;bottom:11px;font-size:19px}
.pol.fly{transform:translateX(130%) rotate(24deg);opacity:0}
.pol.nt{transition:none}
.phone{width:min(260px,70vw);margin:18px auto 0;background:var(--ink);border-radius:34px;padding:12px;box-shadow:0 10px 0 var(--pink)}
.phone video{width:100%;display:block;border-radius:22px;background:#000}
.end{font-size:22px;font-weight:900;margin:34px 0 4px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
#snd{position:fixed;top:12px;right:12px;z-index:10;width:48px;height:48px;border-radius:50%;border:4px solid #fff;background:var(--lil);font-size:22px;cursor:pointer;box-shadow:0 4px 0 #0003}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>

<p class="hint" id="st">先點一下蠟燭上的圈圈，幫蛋糕點火 🔥</p>
<div class="btns" id="blowbox" hidden>
<button class="big" id="mic">🎤 對著手機吹氣</button><button class="big alt" id="tap">👆 點一下吹</button></div>
<div id="bals" hidden>
<button class="bal" style="background:var(--pink)" aria-label="第一個祝福">🌸</button>
<button class="bal" style="background:var(--sky)" aria-label="第二個祝福">🧭</button>
<button class="bal" style="background:var(--sun)" aria-label="第三個祝福">🕊️</button></div>
<div id="wishes"></div>
</section>

<script>
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d');
const COL=['#ff5fa2','#ffd23f','#4fc3ff','#5eecbd','#b08cff','#ff9a3c'];
let P=[],lit=new Set(),done=false,opened=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function conf(x,y,n=120){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=4+Math.random()*9;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:4+Math.random()*6,c:COL[i%6],rot:Math.random()*6,l:90+Math.random()*50})}if(P.length===n)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);for(const p of P){p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()}if(P.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}
const st=t=>$('#st').textContent=t;

// ===== 音效與生日歌（WebAudio 合成） =====
let AC=null,MG=null,muted=false,songT=[];
function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:.7;MG.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function note(f,t,d,type='sine',v=.25){const a=au();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05)}
const hz=n=>440*Math.pow(2,(n-9)/12);// n: C4=0
const S={
 pop(){const a=au();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(120,t+.12);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.2)},
 light(){const a=au();if(!a)return;const t=a.currentTime;[84,88,91].forEach((n,i)=>note(hz(n-12),t+i*.07,.35,'triangle',.18))},
 wish(){const a=au();if(!a)return;const t=a.currentTime;[0,4,7,12].forEach((n,i)=>note(hz(n+12),t+.1+i*.09,.5,'sine',.2))},
 flip(){const a=au();if(!a)return;const t=a.currentTime;note(900,t,.06,'square',.08);note(500,t+.05,.08,'square',.06)},
 tick(n){const a=au();if(!a)return;note(hz(n*2+7),a.currentTime,.25,'triangle',.22)},
 blow(){const a=au();if(!a)return;const t=a.currentTime,len=a.sampleRate*.6,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=1200;g.gain.value=.5;s.connect(f);f.connect(g);g.connect(MG);s.start(t);
  [0,4,7,12,16].forEach((n,i)=>note(hz(n+12),t+.35+i*.08,.7,'triangle',.18))},
 song(){S.stop();const a=au();if(!a||muted)return;const t0=a.currentTime+1.1,B=.46;
  // [音高(C4=0), 拍數]
  const M=[[7,.75],[7,.25],[9,1],[7,1],[12,1],[11,2],[7,.75],[7,.25],[9,1],[7,1],[14,1],[12,2],[7,.75],[7,.25],[19,1],[16,1],[12,1],[11,1],[9,1],[17,.75],[17,.25],[16,1],[12,1],[14,1],[12,2.5]];
  let t=t0,k=0;M.forEach(([n,b])=>{note(hz(n),t,b*B*1.1,'triangle',.3);note(hz(n+12),t,b*B*.6,'sine',.08);t+=b*B});
  [0,0,7,7,0,0,7,7].forEach((n,i)=>{});
  // 簡單低音：每 3 拍一次
  for(let x=t0,i=0;x<t;x+=3*B,i++)note(hz([-12,-5,-12,-5,-12,-7,-5,-12][i%8]),x,B*2.5,'sine',.22);
  songT.push(setTimeout(()=>{[0,4,7,12,16].forEach((n,i)=>note(hz(n+12),AC.currentTime+i*.1,1.2,'triangle',.18));conf(innerWidth/2,innerHeight/3,100)},(t-a.currentTime)*1000))},
 stop(){songT.forEach(clearTimeout);songT=[];if(AC&&MG){const g=MG;g.disconnect();MG=AC.createGain();MG.gain.value=muted?0:.7;MG.connect(AC.destination)}}
};
$('#snd').onclick=()=>{au();muted=!muted;$('#snd').textContent=muted?'🔇':'🔊';if(muted)S.stop();else if(done)S.song()};
document.addEventListener('pointerdown',()=>au(),{once:true});
// 標題文字
document.querySelectorAll('h1>span').forEach((s,i)=>{s.style.color=COL[i*2%6];s.style.animationDelay=i*.12+'s';s.onclick=()=>{s.classList.remove('b');void s.offsetWidth;s.classList.add('b');const r=s.getBoundingClientRect();S.tick(i+2);conf(r.x+r.width/2,r.y+r.height/2,30)}});
// 點火
const fl=[...document.querySelectorAll('.fl')];
document.querySelectorAll('.hit').forEach(h=>h.onclick=e=>{const i=+h.dataset.i;if(lit.has(i))return;lit.add(i);S.light();fl[i].classList.add('on');h.classList.add('done');conf(e.clientX,e.clientY,25);
 if(lit.size==2){st('21 根火苗亮了！吹熄它並許願 🌟');$('#blowbox').hidden=false}else st('再點亮另一根～')});
// 吹蠟燭
function blow(){if(done)return;done=true;S.blow();setTimeout(S.song,500);fl.forEach(f=>f.classList.remove('on'));
 [0,1].forEach(i=>{const s=document.createElement('div');s.className='smoke';s.textContent='💨';s.style.left=(i?60:38)+'%';s.style.top='6%';$('#cw').appendChild(s);setTimeout(()=>s.remove(),1700)});
 $('#blowbox').hidden=true;conf(innerWidth/2,innerHeight/2.5,160);$('#sub').textContent='生日快樂 🎉';
 st('許願成功！戳破氣球，收下 3 個祝福 🎈');$('#bals').hidden=false}
$('#tap').onclick=blow;
$('#mic').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(s).connect(an);const d=new Uint8Array(512);let n=0;st('用力吹～ 💨');
 (function L(){if(done){s.getTracks().forEach(t=>t.stop());ac.close();return}an.getByteTimeDomainData(d);let m=0;for(const v of d)m=Math.max(m,Math.abs(v-128));n=m>70?n+1:0;n>5?blow():requestAnimationFrame(L)})()}catch(e){st('麥克風打不開，改按「點一下吹」吧 👆')}};
// 祝福氣球
const W=[['祝福未來的你走花路 🌸','#ffd0e6'],['祝福未來的你不再徬徨 🧭','#c9ecff'],['祝福未來的你自由快樂 🕊️','#fff0a8']];
document.querySelectorAll('.bal').forEach((b,i)=>b.onclick=()=>{const r=b.getBoundingClientRect();conf(r.x+r.width/2,r.y+r.height/2,50);S.pop();setTimeout(S.wish,120);b.remove();
 const w=document.createElement('div');w.className='wish';w.textContent=W[i][0];w.style.background=W[i][1];$('#wishes').appendChild(w);
 if(++opened==3){$('#bals').hidden=true;st('三個祝福都收好了 💌');setTimeout(()=>{$('#s2').hidden=false;$('#s2').scrollIntoView({behavior:'smooth'});count()},1400)}});
// 7 年計數
